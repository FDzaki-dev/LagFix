name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > release.keystore; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -f release.keystore ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle --no-daemon --stacktrace "$TASK" 2>&1 | tee build_output.log

      # Pathway log_fail: nama file WAJIB diakhiri run_number dari workflow ini.
      - name: Simpan log kegagalan
        if: failure()
        run: |
          mkdir -p logs
          cp build_output.log "logs/LagFix_build_fail_log_${{ github.run_number }}.txt"
      - name: Unggah log kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LagFix-fail-log-${{ github.run_number }}
          path: logs/LagFix_build_fail_log_${{ github.run_number }}.txt

      - name: Unggah APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LagFix-apk
          path: app/build/outputs/apk/**/*.apk

      # Pathway GitHub Release: tag & nama rilis dari run_number yang sama dengan log_fail agar mudah ditelusuri.
      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "LagFix build ${{ github.run_number }}"
          make_latest: true
          files: app/build/outputs/apk/**/*.apk

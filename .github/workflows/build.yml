name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit test
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee build_output.log

      # F1 (PENDING_ROADMAP.md): lint (Android, bawaan AGP) + detekt (static analysis Kotlin).
      # v88 (perintah user: "lintDebug/detekt tolong diperketat"): BLOCKING. Step Lint & Detekt
      # memakai continue-on-error HANYA supaya KEDUANYA selalu jalan & semua temuan terlihat dalam
      # satu run; keputusan gagal dipegang step "Gerbang lint & detekt" di bawah (exit 1 bila salah
      # satunya `failure`) -> build MERAH SEBELUM step Build/Release (0 APK/rilis dari kode yg
      # melanggar). Merah di awal DISENGAJA (backlog temuan lama belum ditriase); jangan kembalikan
      # ke non-blocking tanpa perintah user. Warning lint dihitung error: lihat `lint {}` di
      # app/build.gradle.kts. detekt: ruleset default, maxIssues 0 (detekt.yml hanya override minimum).
      # v52: lint & detekt DIPISAH jadi 2 step (dulu satu command `gradle lintDebug detekt` tanpa
      # --continue: kegagalan task pertama menghentikan task kedua & menutupi penyebabnya). Log
      # mentah tiap step disimpan (tee) lalu dimasukkan ke log kegagalan (step "Simpan log
      # kegagalan").
      # v92 (permintaan user: "disatukan pathway lintdebug/detekt dengan log failure biar gak
      # double unduhan"): laporan lint & detekt TIDAK lagi diunggah sbg artifact terpisah
      # (`LagFix-lint-detekt-report-<run>` dihapus). Semuanya masuk SATU artifact
      # `LagFix-fail-log-<run>` (hanya saat build gagal): file `LagFix_build_fail_log_<run>.txt`
      # di root + folder `lint_detekt/` (laporan detekt, file lint-results*, listing).
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace lintDebug 2>&1 | tee lint_output.log
      - name: Detekt
        id: detekt
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace detekt 2>&1 | tee detekt_output.log
      # Kumpulkan ke logs/lint_detekt (if: always): log mentah, laporan detekt, semua file
      # lint-results* yg ada di mana pun di app/build (path asli terbaca juga dari lint_output.log),
      # daftar semua nama file ber-"lint" (hanya nama), dan listing app/build/reports.
      # Folder ini diunggah BERSAMA log kegagalan (step "Unggah log kegagalan" di bawah).
      - name: Kumpulkan laporan lint & detekt
        if: always()
        run: |
          mkdir -p logs/lint_detekt
          cp lint_output.log detekt_output.log logs/lint_detekt/ 2>/dev/null || true
          cp -r app/build/reports/detekt logs/lint_detekt/ 2>/dev/null || true
          find app/build -iname '*lint*' > logs/lint_detekt/lint_files_found.txt 2>&1 || true
          find app/build -iname 'lint-results*' -type f -exec cp --parents {} logs/lint_detekt/ \; 2>/dev/null || true
          ls -laR app/build/reports > logs/lint_detekt/reports_listing.txt 2>&1 || true

      # v88: gerbang BLOCKING. `outcome` = hasil mentah step (tidak terpengaruh continue-on-error).
      - name: Gerbang lint & detekt (BLOCKING)
        if: ${{ steps.lint.outcome == 'failure' || steps.detekt.outcome == 'failure' }}
        run: |
          echo "lint=${{ steps.lint.outcome }} detekt=${{ steps.detekt.outcome }}"
          echo "Build dihentikan: temuan lint/detekt wajib diperbaiki (rincian: artifact LagFix-fail-log-<run>: log kegagalan + folder lint_detekt/)."
          exit 1

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > release.keystore; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -f release.keystore ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle --no-daemon --stacktrace "$TASK" 2>&1 | tee build_output.log

      # Pathway log_fail: nama file WAJIB diakhiri run_number dari workflow ini.
      - name: Simpan log kegagalan
        if: failure()
        run: |
          mkdir -p logs
          OUT="logs/LagFix_build_fail_log_${{ github.run_number }}.txt"
          : > "$OUT"
          # v88: lint & detekt kini blocking -> log-nya WAJIB ikut (dulu hanya build_output.log,
          # yg pada kegagalan lint/detekt cuma berisi log Unit test yg hijau). Urutan = urutan pipeline.
          for f in build_output.log lint_output.log detekt_output.log; do
            if [ -f "$f" ]; then { echo "===== $f ====="; cat "$f"; echo; } >> "$OUT"; fi
          done
          LINT_TXT="$(find app/build -name 'lint-results-debug.txt' -type f 2>/dev/null | head -n 1)"
          if [ -n "$LINT_TXT" ]; then { echo "===== $LINT_TXT ====="; cat "$LINT_TXT"; } >> "$OUT"; fi
      # v92: SATU artifact utk semuanya. path = folder logs/ -> root artifact berisi
      # LagFix_build_fail_log_<run>.txt + lint_detekt/ (laporan lint & detekt).
      - name: Unggah log kegagalan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LagFix-fail-log-${{ github.run_number }}
          path: logs/

      - name: Unggah APK (artifact)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: LagFix-apk
          path: app/build/outputs/apk/**/*.apk

      # v106 (laporan user: "artefak GitHub hanya mengunggah zip aplikasi, lintdebug/detekt kosong"):
      # saat build HIJAU laporan lint & detekt (folder logs/lint_detekt dari step "Kumpulkan" di atas)
      # kini ikut diunggah sbg artifact tersendiri. Hanya if: success(): jalur GAGAL tetap SATU artifact
      # `LagFix-fail-log-<run>` (v92, tanpa unduhan ganda) dan tak diubah. Nama beda dari artifact v92
      # yg dihapus. Isi saat hijau = log mentah + laporan; kecil/ringkas karena 0 temuan blocking.
      # continue-on-error: kegagalan unggah laporan TAK boleh menghentikan jalur rilis di bawahnya.
      - name: Unggah laporan lint & detekt (artifact)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LagFix-lint-detekt-${{ github.run_number }}
          path: logs/lint_detekt/
          if-no-files-found: warn

      # Asset rilis WAJIB nama unik per build (bukan "app-release.apk"/"app-debug.apk" generik dari Gradle):
      # nama generik yg sama di tiap rilis bikin browser nabrak nama saat unduh berkali-kali
      # (jadi "app-release (1).apk", "(2).apk", dst menumpuk) & tidak informatif versi apa isinya.
      - name: Siapkan APK rilis (nama unik & informatif)
        if: success()
        run: |
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          APK_KIND=$([ -f release.keystore ] && echo release || echo debug)
          cp "$APK_SRC" "dist/LagFix_build-${{ github.run_number }}_${APK_KIND}.apk"

      # Pathway GitHub Release: tag & nama rilis dari run_number yang sama dengan log_fail agar mudah ditelusuri.
      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "LagFix build ${{ github.run_number }}"
          make_latest: true
          files: dist/*.apk

      # Pathway APK debug -> artifact GitHub (v41, utk diagnosis logcat): SENGAJA di PALING AKHIR
      # & terpisah total dari jalur rilis (dir dist_debug, BUKAN dist; 0 masuk GitHub Release, jadi
      # updater in-app yg baca releases/latest tak pernah kena APK debug). continue-on-error true:
      # kegagalan build debug tak boleh merusak jalur rilis yg sudah selesai di atas.
      # run_number sama dgn rilis -> versionCode sama (0 masalah downgrade saat install).
      - name: Build APK debug (pathway artefak debug)
        id: debug_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee debug_build_output.log
      # Kalau release.keystore ada, APK debug ditandatangani ULANG dgn kunci yg sama dgn rilis
      # (apksigner) supaya bisa di-install menimpa app rilis TANPA uninstall (uninstall = hapus
      # pengaturan & izin Shizuku). Kunci debug bawaan Gradle dibuat baru di tiap runner -> tak
      # bisa dipakai menimpa apa pun. Secret cuma lewat env (0 dicetak, 0 masuk file/log).
      - name: Siapkan APK debug (nama unik)
        id: debug_pack
        if: steps.debug_build.outcome == 'success'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist_debug
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          OUT="dist_debug/LagFix_build-${{ github.run_number }}_debug.apk"
          if [ -f release.keystore ]; then
            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            APKSIGNER="$(ls -d "$SDK_DIR"/build-tools/*/apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$OUT" "$SRC"
            "$APKSIGNER" verify "$OUT"
          else
            cp "$SRC" "$OUT"
          fi
      - name: Unggah APK debug (artifact)
        if: steps.debug_pack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: LagFix-debug-apk-${{ github.run_number }}
          path: dist_debug/LagFix_build-${{ github.run_number }}_debug.apk
          if-no-files-found: error
      - name: Unggah log gagal build debug
        if: steps.debug_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: LagFix-debug-fail-log-${{ github.run_number }}
          path: debug_build_output.log
          if-no-files-found: ignore

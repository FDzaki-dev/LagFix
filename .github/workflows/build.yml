name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit test
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee build_output.log

      # F1 (PENDING_ROADMAP.md): lint (Android, bawaan AGP) + detekt (static analysis Kotlin).
      # continue-on-error SENGAJA true: batch pertama, belum ada baseline/triage temuan lama ->
      # non-blocking dulu supaya pipeline hijau existing (Unit test/Build/Release) tidak
      # mendadak merah krn gaya-kode lama yg belum pernah dicek. Tidak mempengaruhi step
      # "Simpan/Unggah log kegagalan" (if: failure()) krn continue-on-error meredam itu by design.
      - name: Lint & detekt (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace lintDebug detekt 2>&1 | tee lint_detekt_output.log
      - name: Unggah laporan lint & detekt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LagFix-lint-detekt-report-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/detekt.html
          if-no-files-found: ignore

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > release.keystore; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -f release.keystore ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle --no-daemon --stacktrace "$TASK" 2>&1 | tee build_output.log

      # Pathway log_fail: nama file WAJIB diakhiri run_number dari workflow ini.
      - name: Simpan log kegagalan
        if: failure()
        run: |
          mkdir -p logs
          cp build_output.log "logs/LagFix_build_fail_log_${{ github.run_number }}.txt"
      - name: Unggah log kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LagFix-fail-log-${{ github.run_number }}
          path: logs/LagFix_build_fail_log_${{ github.run_number }}.txt

      - name: Unggah APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LagFix-apk
          path: app/build/outputs/apk/**/*.apk

      # Asset rilis WAJIB nama unik per build (bukan "app-release.apk"/"app-debug.apk" generik dari Gradle):
      # nama generik yg sama di tiap rilis bikin browser nabrak nama saat unduh berkali-kali
      # (jadi "app-release (1).apk", "(2).apk", dst menumpuk) & tidak informatif versi apa isinya.
      - name: Siapkan APK rilis (nama unik & informatif)
        if: success()
        run: |
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          APK_KIND=$([ -f release.keystore ] && echo release || echo debug)
          cp "$APK_SRC" "dist/LagFix_build-${{ github.run_number }}_${APK_KIND}.apk"

      # Pathway GitHub Release: tag & nama rilis dari run_number yang sama dengan log_fail agar mudah ditelusuri.
      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "LagFix build ${{ github.run_number }}"
          make_latest: true
          files: dist/*.apk

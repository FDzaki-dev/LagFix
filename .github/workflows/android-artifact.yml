name: Android CI Artifact for Claude

# v151 — SATU-SATUNYA tempat lint + detekt (perintah user: "pindahkan total lintdebug/detekt ke workflow artifact for
# Claude biar simple"). Sebelumnya (v88-v150) lintDebug + detekt jadi gerbang BLOCKING di `build.yml`; sejak v151 gerbang itu
# dihapus dan `build.yml` hanya tes unit + build.
#
# Keluaran = SATU berkas `laporan-untuk-claude.txt` (artifact `LagFix_laporan-untuk-claude_run<N>`, retensi 7 hari) yang
# PAKET KOMPLIT: penanda proyek, data mentah lingkungan (JDK/Gradle/platform SDK runner/versi AGP-Kotlin-SDK), ArchUnit,
# SpotBugs, detekt + detekt typed + lintDebug LENGKAP (bukan lagi kutipan), tes unit (+ frame stack tes gagal), peringatan
# kompilator Kotlin, pesan DEPRECATED Gradle/AGP/plugin (`--warning-mode all`), dan hasil `assembleDebug` (galat kompilasi/paket
# ikut masuk) -> cukup unggah SATU berkas ini ke Claude; `LagFix-fail-log-*` dari build.yml tidak perlu lagi dikirim.
#
# Perakit laporan ada di `.github/scripts/laporan-untuk-claude.sh` (bisa diuji lokal dgn berkas tiruan).
#
# Workflow TERPISAH dari `build.yml` (tes + build + rilis): runner sendiri, berjalan paralel, kegagalan di sini TIDAK
# memengaruhi APK/Release. Semua langkah analisis NON-BLOCKING; alat yang tak jalan / laporan yang tak terbentuk dicatat
# `NOT VERIFIED` (alat gagal != lulus) — TIDAK PERNAH "bersih".
#
# Catatan desain (dibawa dari v148):
#  - Gradle: LagFix tak menyimpan `gradlew`; langkah yang SAMA dgn `build.yml` (`gradle/actions/setup-gradle`, Gradle 9.6.0 sejak v152).
#  - v152: detekt di-apply BERSYARAT lewat `-Plagfix.detekt=true` (hanya dua invocation detekt di bawah).
#  - Varian DEBUG semua: tanpa keystore/secret.
#  - SpotBugs lewat `config/spotbugs/spotbugs.gradle.kts` (JavaExec CLI), di-apply hanya dgn `-Plagfix.spotbugs=true`;
#    `--no-configuration-cache` utk ArchUnit/SpotBugs.
#  - ArchUnit = tes `ArchitectureTest` (JUnit polos, selalu menulis laporannya, TIDAK PERNAH menggagalkan tes).
#  - Urutan invocation Gradle TERPISAH (kegagalan satu tak menjatuhkan yang lain).
#  - Semua invocation `--no-build-cache` (tugas kompilasi dari cache tidak mencetak peringatan -> 0 peringatan bisa berarti
#    "dari cache", bukan "bersih"). v151: + `--warning-mode all` supaya pesan deprecated Gradle/AGP/plugin tercetak lengkap.
#  - Pemicu: push `main` + manual. RUN_NUMBER di laporan = counter workflow ini, BUKAN versionCode APK -> cocokkan lewat COMMIT.
#  - Penanda versi = angka `RESUME POINT: v<N>` di `PROJECT_STATE.md`.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: android-artifact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    # Label DIPIN `ubuntu-24.04` (bukan `ubuntu-latest`) — sama dgn `build.yml` (runner-images#14748). Pindah ke
    # `ubuntu-26.04` = batch terpisah.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # v151: setup-gradle v4 = Node.js 20 (anotasi "Node.js 20 actions are deprecated"); v5 = Node 24, tanpa syarat lisensi
      # baru (v6 mewajibkan menerima Terms of Use komponen caching). `continue-on-error`: gagal di sini -> laporan tetap
      # terbentuk dan memuat `NOT VERIFIED` + kutipan log.
      - name: Set up Gradle 9.6.0
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      # 1. Data mentah lingkungan (dibaca perakit laporan). Tak pernah gagal.
      - name: Catat lingkungan runner
        if: always()
        run: |
          {
            echo "JAVA=$(java -version 2>&1 | head -n 1)"
            echo "GRADLE=$(gradle --version 2>/dev/null | grep -m1 '^Gradle ' || echo 'n/a')"
            echo "SDK_PLATFORMS=$(ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/platforms" 2>/dev/null | sort -V | tr '\n' ' ')"
          } > gradle-env.txt
          cat gradle-env.txt
          exit 0

      # 2. Enam invocation Gradle TERPISAH. Exit code disimpan ke berkas; langkah ini SELALU sukses.
      #    Urutan: lint/detekt, detektDebug, ArchUnit, SpotBugs, tes unit, assembleDebug.
      - name: lintDebug + detekt + detektDebug + ArchUnit + SpotBugs + tes unit + assembleDebug (NON-BLOCKING)
        id: analysis
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set +e
          gradle detekt lintDebug -Plagfix.detekt=true --continue --no-build-cache --warning-mode all > gradle-static.log 2>&1
          echo "STATIC_EXIT=$?" > gradle-exit.txt
          gradle detektDebug -Plagfix.detekt=true --continue --no-build-cache --warning-mode all > gradle-typed.log 2>&1
          echo "TYPED_EXIT=$?" >> gradle-exit.txt
          gradle testDebugUnitTest --tests "com.lagfix.fstrim.ArchitectureTest" --continue --no-build-cache --no-configuration-cache --warning-mode all > gradle-arch.log 2>&1
          echo "ARCH_EXIT=$?" >> gradle-exit.txt
          gradle spotbugsDebug -Plagfix.spotbugs=true --no-build-cache --no-configuration-cache --warning-mode all > gradle-spotbugs.log 2>&1
          echo "SPOTBUGS_EXIT=$?" >> gradle-exit.txt
          gradle testDebugUnitTest --continue --no-build-cache --warning-mode all > gradle-test.log 2>&1
          echo "TEST_EXIT=$?" >> gradle-exit.txt
          gradle assembleDebug --continue --no-build-cache --warning-mode all > gradle-assemble.log 2>&1
          echo "ASSEMBLE_EXIT=$?" >> gradle-exit.txt
          cat gradle-exit.txt
          exit 0

      # 3. Rakit SATU laporan lengkap. Status tiap alat HANYA dari berkas laporan yang benar-benar ada.
      - name: Create Complete Report for Claude
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/laporan-untuk-claude.sh

      # 4. Artifact resmi GitHub: SATU berkas .txt (paket komplit; mudah diunduh di HP lalu diunggah ke Claude).
      - name: Upload Report for Claude
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Nama = `LagFix_laporan-untuk-claude_run<N>`. Retensi 7 hari (konstitusi).
          name: LagFix_laporan-untuk-claude_run${{ github.run_number }}
          path: laporan-untuk-claude.txt
          retention-days: 7
          if-no-files-found: warn

# F1 triase: override MINIMUM di atas ruleset default detekt (`buildUponDefaultConfig = true`
# di app/build.gradle.kts). Hanya yang terbukti false-positive/by-design (bukti: log CI #73);
# rule lain TIDAK diubah. `ignoreAnnotated` = kunci umum detekt >= 1.19 (berlaku untuk semua rule).
#
# v58:
#  - FunctionNaming: 15/15 temuan = fungsi @Composable ber-nama PascalCase (konvensi wajib Compose).
#  - MagicNumber: literal UI di dalam fungsi @Composable (mis. 16.dp, 0.5f) bukan "magic number" nyata.
# v89 (log CI #73, 149 temuan; hanya yang struktural & terbukti dari kode):
#  - LongParameterList (MainTab, UpdateCard), LongMethod (HomeScreen 161, SettingsTab 244,
#    LogReaderCard 128, RunHistoryChart 105, HeroStatusCard 62, UpdateCard 60), CyclomaticComplexMethod
#    (HomeScreen, SettingsTab, LogReaderCard): semuanya @Composable = ukuran UI deklaratif + callback
#    state-hoisting, bukan logika bercabang. Fungsi NON-Composable tetap diperiksa.
#  - CyclomaticComplexMethod `ignoreSimpleWhenEntries`: `exitReasonName` = tabel konstanta (15 cabang
#    satu-ekspresi), bukan kompleksitas logika.
#  - TooManyFunctions `ignoreAnnotatedFunctions`: MainActivity.kt 25 fungsi, 15 di antaranya @Composable.
#  - EmptyFunctionBlock `ignoreOverridden`: PrefsTest = fake SharedPreferences, 2 override kosong
#    (register/unregister listener) yg wajib ada utk memenuhi interface.
# v108 (Q8, perintah user "lanjutkan progress yg bisa dgn modal lintdebug/detekt only"): PENGUATAN pengamat, bukan
#  pelonggaran. `ForbiddenImport` melarang `kotlinx.coroutines.runBlocking` (blok thread, Vital Guard Thread Safety:
#  dilarang blok Main) & `kotlinx.coroutines.GlobalScope` (coroutine lepas lifecycle). Tak butuh type resolution (CI
#  menjalankan `gradle detekt` biasa). Bukti: grep v107 = 0 import keduanya di app/src (main + test) -> tak membuat
#  CI merah dari kode yang ada. `InjectDispatcher` SENGAJA TIDAK diaktifkan (menolak `Dispatchers.IO` langsung).
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
  ForbiddenImport:
    active: true
    imports: ['kotlinx.coroutines.runBlocking', 'kotlinx.coroutines.GlobalScope']

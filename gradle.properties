org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# v152 — migrasi AGP 8.7.3 -> 9.5.0 (Tahap B, perintah user "Lanjut B"): perilaku build LAMA dipertahankan eksplisit.
# Opt-out Kotlin bawaan AGP & DSL baru (plugin `org.jetbrains.kotlin.android` + detekt 1.x belum kompatibel; opt-out ini
# dihapus di AGP 10 -> batch migrasi berikutnya).
android.builtInKotlin=false
android.newDsl=false
# Default yang berubah di AGP 9.0 dikembalikan ke nilai AGP 8.13 (daftar dari catatan rilis AGP 9.0 / Upgrade Assistant):
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.onlyEnableUnitTestForTheTestedBuildType=false
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
